<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<!--/*
  Файл зі спільними фрагментами (повторно використовуваними шматками HTML).
  Коментарі виду "<!- -/* ... */- ->" - це коментарі ПАРСЕРА Thymeleaf: вони видаляються і НЕ потрапляють у HTML у браузері
  (на відміну від звичайних HTML-коментарів).
  xmlns:th  - вмикає атрибути th:* (Thymeleaf);
  xmlns:sec - вмикає sec:* (інтеграція зі Spring Security: перевірка ролей у шаблоні).
*/-->

<!--/* Фрагмент "head(title)" з параметром title: підключається через th:replace="~{fragments :: head('Назва')}" */-->
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <title th:text="${title}">Booking</title> <!--/* th:text підставляє значення параметра як текст */-->
    <style>
        body { font-family: system-ui, sans-serif; margin: 2rem auto; max-width: 70rem; padding: 0 1rem; }
        nav { display: flex; gap: 1rem; align-items: center; border-bottom: 1px solid #ccc; padding-bottom: .5rem; margin-bottom: 1rem; }
        nav .spacer { flex: 1; }
        table { border-collapse: collapse; width: 100%; margin: 1rem 0; }
        th, td { border-bottom: 1px solid #ddd; padding: .4rem; text-align: left; vertical-align: middle; }
        .ok { background: #e6f4ea; padding: .5rem; margin: .5rem 0; }
        .err { background: #fce8e6; padding: .5rem; margin: .5rem 0; }
        form.inline { display: inline; }
        fieldset { margin: 1rem 0; }
    </style>
</head>
<body>

<!--/* Фрагмент "nav": верхнє меню. Підключається на кожній сторінці через th:replace="~{fragments :: nav}" */-->
<nav th:fragment="nav">
    <!--/* @{/rooms} - URL відносно кореня застосунку (Thymeleaf додає context-path, якщо він є) */-->
    <a th:href="@{/rooms}">Rooms</a>
    <a th:href="@{/bookings}">Bookings</a>
    <!--/* sec:authorize: елемент виводиться ЛИШЕ якщо вираз істинний. Тут посилання Admin бачить тільки ADMIN.
         УВАГА: це лише приховування в UI, а реальний захист - у SecurityConfig (/admin/** -> hasRole ADMIN). */-->
    <a th:href="@{/admin}" sec:authorize="hasRole('ADMIN')">Admin</a>
    <span class="spacer"></span>
    <!--/* sec:authentication="name" виводить ім'я поточного користувача (preferred_username із Keycloak) */-->
    <span sec:authentication="name">user</span>
    <!--/* Вихід - це POST /logout. th:action автоматично додає прихований CSRF-токен у форму */-->
    <form class="inline" th:action="@{/logout}" method="post"><button type="submit">Log out</button></form>
</nav>
</body>
</html>
